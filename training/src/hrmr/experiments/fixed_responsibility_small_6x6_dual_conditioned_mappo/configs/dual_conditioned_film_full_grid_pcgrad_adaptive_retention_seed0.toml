# 6x6 fixed-responsibility FiLM-Actor MAPPO; 21 duals, PCGrad, and adaptive retention.
[experiment]
profile = "fixed_responsibility_small_6x6_dual_conditioned_film_actor_pcgrad_adaptive_retention_full_grid_mappo_seed0"
environment_config = "environment.toml"
activation = "tanh"
device = "auto"
torch_num_threads = 1
randomize_actor_target_order = true
independent_actors = true
independent_actor_init_seed_base = 100

[training]
num_parallel_envs = 42
rollout_length = 128
total_environment_steps = 22579200
ppo_epochs = 5
minibatch_size = 2688
actor_learning_rate = 0.0003
critic_learning_rate = 0.0003
ppo_clip = 0.2
max_grad_norm = 0.5
entropy_coefficient_start = 0.02
entropy_coefficient_end = 0.02
entropy_decay_fraction = 0.70
avg_rate_ema = 0.05
value_anchor_coefficient = 0.001
normalize_combined_advantage = true
n_step = 32
evaluation_interval = 2257920
early_stopping = false
early_stopping_patience = 3
objective_tolerance = 0.005
occupancy_tolerance = 0.05
analytic_tolerance = 0.08

[environment]
action_slip_probability = 0.0

[evaluation]
seeds = [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019]
burn_in_steps = 100
evaluation_steps = 2000

[assignment]
training_seed = 0
agent_targets = [["S1", "H1"], ["S4", "H3"], ["S2", "H2"], ["S3", "H4"]]
actor_input_dimension = 57
critic_input_dimension = 17
reward_eligibility = "owner_only"
cost_scope = "all_physical_hazard_exposure"

[sampling]
initial_state_distribution = "uniform_without_replacement_all_grid_cells"
restart_interval_per_environment = 1000
reset_rng_domain = 1381192786

[dual_conditioning]
values = [0.0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0, 6.5, 7.0, 7.5, 8.0, 8.5, 9.0, 9.5, 10.0]
conditioning_max = 10.0
assignment = "fixed_environment_slots"
environments_per_dual = 2
advantage_normalization = "per_lambda"
minibatch_sampling = "stratified_by_lambda"
actor_conditioning = "continuous_film"
critic_conditioning = "concatenated_mlp"
actor_gradient_aggregation = "pcgrad"
progress_every_updates = 100

[policy_retention]
mode = "adaptive_best_calibration_anchor_kl"
coefficient = 1.0
anchor_capacity = 128
improvement_tolerance = 0.0
apply_every_minibatch = true
target_kl = 0.003
adaptation_rate = 0.05
min_coefficient = 0.05
max_coefficient = 20.0
